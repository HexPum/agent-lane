# Agent Lane guest template. The provider also passes --mount-none.
minimumLimaVersion: 2.0.0

base: template:docker

mounts: []

cpus: 4
memory: 8GiB
disk: 30GiB

provision:
  - mode: system
    script: |
      #!/bin/bash
      set -eux -o pipefail
      if ! command -v node >/dev/null 2>&1; then
        apt-get update
        apt-get install --no-install-recommends -y ca-certificates curl git jq
        curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
        apt-get install --no-install-recommends -y nodejs
        rm -rf /var/lib/apt/lists/*
      fi
      command -v codex >/dev/null 2>&1 || npm install --global @openai/codex@0.151.0
      corepack enable
  - mode: user
    script: |
      #!/bin/bash
      set -eux -o pipefail
      export PATH="$HOME/.local/bin:$PATH"
      # To bump: download and review the installer, run sha256sum on it,
      # then update this hash in a reviewed PR.
      CLAUDE_INSTALLER_SHA256="cde4f1702d3b1695f92b73d26888364e17bca476e17f0fd676484c951d36c125"
      claude_installer="$(mktemp)"
      trap 'rm -f "$claude_installer"' EXIT
      curl --fail --silent --show-error --location --proto '=https' \
        --output "$claude_installer" https://claude.ai/install.sh
      printf '%s  %s\n' "$CLAUDE_INSTALLER_SHA256" "$claude_installer" | sha256sum --check --strict -
      bash "$claude_installer"

probes:
  - description: agent runtime is available
    script: |
      #!/bin/bash
      set -eu
      export PATH="$HOME/.local/bin:$PATH"
      command -v git
      command -v node
      command -v npm
      command -v docker
      command -v claude
      command -v codex
